name: cedar_ffi
description: FFI bindings for the Cedar policy language, written in Rust.
version: 1.0.0
repository: https://github.com/celest-dev/cedar-dart/tree/main/packages/cedar_ffi

environment:
  sdk: ^3.9.0
resolution: workspace

dependencies:
  cedar: ^1.0.0
  ffi: ^2.1.0
  meta: ^1.10.0
  native_toolchain_rs: ^0.1.2+3
  logging: ^1.3.0
  hooks: ^0.20.4

dev_dependencies:
  cedar_tests:
    path: ../cedar_tests
  ffigen: ^19.1.0
  lints: ^6.0.0
  path: ^1.9.0
  test: ^1.26.0
